name: Test matrix

on:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.14.0"
            run-tests: true
          - os: macos-latest
            node: "22.14.0"
            run-tests: true
          - os: macos-latest
            node: "25.9.0"
            run-tests: true
          - os: windows-latest
            node: "22.14.0"
            run-tests: true
          - os: ubuntu-latest
            node: "20.19.5"
            run-tests: false
          - os: windows-latest
            node: "20.19.5"
            run-tests: true
          - os: windows-latest
            node: "24.11.1"
            run-tests: true
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        if: matrix.run-tests && matrix.os != 'windows-latest'
        run: npm test

      - name: Test (Windows)
        if: matrix.run-tests && matrix.os == 'windows-latest'
        run: npm test -- --maxWorkers=1

      - name: Build and package check
        run: npm run build && npm run pack:check && npm run pack:smoke
